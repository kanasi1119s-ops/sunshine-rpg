<title>サンシャインRPG BGMプレイヤー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 配置: 左に曲リスト（章ごと）、上に固定の再生バー。スマホでは1列。 */
:root {
  --bg: #f3f1f6; --panel: #ffffff; --fg: #1d1a26; --muted: #6a6478; --line: #ddd8e6;
  --accent: #5a3fd1; --accent-fg: #ffffff; --now: #ece7fb;
  --display: "DotGothic16", "Zen Kaku Gothic New", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14121b; --panel: #1e1b28; --fg: #ece9f4; --muted: #9c95ae; --line: #322d40;
  --accent: #a892ff; --accent-fg: #14121b; --now: #2a2445; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14121b; --panel: #1e1b28; --fg: #ece9f4; --muted: #9c95ae; --line: #322d40;
  --accent: #a892ff; --accent-fg: #14121b; --now: #2a2445; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 14px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0; letter-spacing: .04em; text-wrap: balance; }
.now { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.now .name { flex: 1 1 12em; min-width: 0; font-weight: 700; }
.now .sub { color: var(--muted); font-size: 13px; }
button { font: inherit; color: inherit; cursor: pointer; }
.stop, .play { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 14px; }
.stop:focus-visible, .row:focus-visible, .se:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seekrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seekrow input { flex: 1 1 10em; min-width: 0; accent-color: var(--accent); }
.small { padding: 6px 10px; font-size: 13px; }
.rep { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14px; }
.rep label { display: inline-flex; align-items: center; gap: 4px; }
.ab { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
button:disabled { opacity: .45; cursor: default; }
.vol { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.vol input { flex: 1; max-width: 240px; accent-color: var(--accent); }
details.ch { margin: 12px 0; }
details.ch > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
details.ch > summary::-webkit-details-marker { display: none; }
details.ch > summary::before { content: "▸"; color: var(--accent); }
details.ch[open] > summary::before { content: "▾"; }
details.ch > summary h2 { margin: 0; }
details.ch > summary .n { color: var(--muted); font-size: 12px; }
details.ch > ul { margin-top: 10px; }
#chnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 6px; }
#chnav button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 12px; }
#chnav .ctl { border-style: dashed; color: var(--muted); }
h2 { font-family: var(--display); font-weight: 400; font-size: 16px; letter-spacing: .06em; margin: 26px 0 8px; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.row .t { flex: 1; min-width: 0; }
.row .t { display: grid; gap: 2px; }
.row .sc { color: var(--muted); font-size: 12px; }
.row .m { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .ic { width: 1.2em; color: var(--accent); font-family: var(--display); }
.row[aria-pressed="true"] { background: var(--now); border-color: var(--accent); }
.fx { display: flex; flex-wrap: wrap; gap: 8px; }
.se { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 16px; }
.note { color: var(--muted); font-size: 13px; margin-top: 28px; }
</style>
<div class="wrap">
  <div class="bar">
    <h1>サンシャインRPG BGMプレイヤー</h1>
    <div class="now"><div class="name" id="name">曲を選ぶと再生します</div><div class="sub" id="sub"></div><button class="stop" id="pause" type="button" disabled>一時停止</button><button class="stop" id="stop" type="button">停止</button></div>
    <div class="seekrow">
      <button class="stop small" id="back" type="button" aria-label="10秒戻る" disabled>−10秒</button>
      <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="再生位置" disabled>
      <button class="stop small" id="fwd" type="button" aria-label="10秒進む" disabled>+10秒</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <div class="rep" role="group" aria-label="リピート">
      <span class="time">リピート</span>
      <label><input type="radio" name="rep" value="one" checked> 1曲</label>
      <label><input type="radio" name="rep" value="all"> 全曲</label>
      <label><input type="radio" name="rep" value="off"> なし</label>
      <label><input type="radio" name="rep" value="ab"> 区間</label>
      <span class="ab" id="abbox" hidden>
        <button class="stop small" id="seta" type="button">A地点</button>
        <button class="stop small" id="setb" type="button">B地点</button>
        <button class="stop small" id="clrab" type="button">解除</button>
        <span class="time" id="abtxt">A —  B —</span>
      </span>
    </div>
    <div class="rep" role="group" aria-label="サウンドの版">
      <span class="time">サウンド</span>
      <label><input type="radio" name="ed" value="modern" checked> 現代的</label>
      <label><input type="radio" name="ed" value="ps2"> PS2世代</label>
      <label><input type="radio" name="ed" value="real"> 実楽器（バンド・オーケストラ）</label>
    </div>
    <label class="vol"><input id="synth" type="checkbox"> 合成音で鳴らす（録音音源と聴き比べ）<span id="sf" class="time"></span></label>
    <label class="vol">音量 <input id="vol" type="range" min="0" max="100" value="60"></label>
  </div>
  <div id="list"></div>
  <div id="fx"></div>
  <p class="note">ゲーム本体と同じ再生エンジンと曲データで鳴らしています（曲は自動でくり返します）。曲名の一部は仮です。</p>
</div>
<script>/*BUNDLE*/</script>
<script>
(function () {
  var B = window.BGM, cur = -1, t0 = 0, raf = 0;
  var list = document.getElementById("list"), rows = [];
  var group = "", ul = null, chNav = document.createElement("div"); chNav.id = "chnav"; var chBoxes = [];
  function mmss(s) { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  B.bgm.forEach(function (e, i) {
    if (e.group !== group) {
      group = e.group;
      var det = document.createElement("details"); det.className = "ch"; det.id = "ch" + chBoxes.length;
      var sum = document.createElement("summary"), h = document.createElement("h2"); h.textContent = group; var cnt = document.createElement("span"); cnt.className = "n"; sum.appendChild(h); sum.appendChild(cnt);
      det.appendChild(sum); ul = document.createElement("ul"); det.appendChild(ul); list.appendChild(det); det._cnt = cnt; det._n = 0; chBoxes.push(det);
    }
    chBoxes[chBoxes.length - 1]._n++; chBoxes[chBoxes.length - 1]._cnt.textContent = chBoxes[chBoxes.length - 1]._n + "曲";
    var li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.className = "row"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = '<span class="ic">▶</span><span class="t"><span class="tt"></span><small class="sc"></small></span><span class="m"></span>';
    b.querySelector(".tt").textContent = e.title;
    b.querySelector(".sc").textContent = e.scene + " ／ " + e.style;
    b.querySelector(".m").textContent = "♩" + e.bpm + "  " + mmss(e.sec);
    b.addEventListener("click", function () { select(i, 0); });
    li.appendChild(b); ul.appendChild(li); rows.push(b);
  });
  // 章の一覧（押すとその章へ移動して開く）と、すべて開く／閉じる
  var allOpen = document.createElement("button"); allOpen.type = "button"; allOpen.className = "ctl"; allOpen.textContent = "すべて開く";
  allOpen.addEventListener("click", function () { chBoxes.forEach(function (d) { d.open = true; }); });
  var allClose = document.createElement("button"); allClose.type = "button"; allClose.className = "ctl"; allClose.textContent = "すべて閉じる";
  allClose.addEventListener("click", function () { chBoxes.forEach(function (d) { d.open = false; }); });
  chNav.appendChild(allOpen); chNav.appendChild(allClose);
  chBoxes.forEach(function (d) { var c = document.createElement("button"); c.type = "button"; c.textContent = d.querySelector("h2").textContent; c.addEventListener("click", function () { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "start" }); }); chNav.appendChild(c); });
  list.insertBefore(chNav, list.firstChild);
  if (chBoxes.length) chBoxes[0].open = true;
  var fxGroup = "", fxBox = null;
  B.effects.forEach(function (e, i) {
    if (e.group !== fxGroup) {
      fxGroup = e.group;
      var h = document.createElement("h2"); h.textContent = "効果音 ／ " + fxGroup; document.getElementById("fx").appendChild(h);
      fxBox = document.createElement("div"); fxBox.className = "fx"; document.getElementById("fx").appendChild(fxBox);
    }
    var b = document.createElement("button"); b.type = "button"; b.className = "se"; b.textContent = e.title;
    b.addEventListener("click", function () { B.playSe(i); });
    fxBox.appendChild(b);
  });
  var seek = document.getElementById("seek"), timeEl = document.getElementById("time"), dragging = false, paused = false, pausedPos = 0;
  function enable(on) { ["pause", "back", "fwd"].forEach(function (id) { document.getElementById(id).disabled = !on; }); seek.disabled = !on; }
  function setRowState(i, on) { rows[i].setAttribute("aria-pressed", on ? "true" : "false"); rows[i].querySelector(".ic").textContent = on ? "♪" : "▶"; }
  function select(i, offset) {
    if (cur >= 0) setRowState(cur, false);
    var dd = rows[i].closest("details"); if (dd) dd.open = true;
    cur = i; paused = false; document.getElementById("pause").textContent = "一時停止";
    B.play(i, offset || 0); setRowState(i, true); enable(true); lastPos = offset || 0; pointA = null; pointB = null; document.getElementById("abtxt").textContent = abText();
    seek.max = B.bgm[i].sec; seek.value = offset || 0;
    document.getElementById("name").textContent = B.bgm[i].title;
    document.getElementById("sub").textContent = B.bgm[i].group;
    cancelAnimationFrame(raf); tick();
  }
  function show(pos) { timeEl.textContent = mmss(pos) + " / " + mmss(B.bgm[cur].sec); }
  // リピート: 1曲（既定）／全曲／なし／区間（A地点〜B地点）
  var repMode = "one", pointA = null, pointB = null, lastPos = 0;
  try { var saved = window.localStorage.getItem("bgmRepeat"); if (saved) repMode = saved; } catch (e) {}
  function setRep(mode) {
    repMode = mode;
    try { window.localStorage.setItem("bgmRepeat", mode); } catch (e) {}
    document.querySelectorAll('input[name="rep"]').forEach(function (r) { r.checked = r.value === mode; });
    document.getElementById("abbox").hidden = mode !== "ab";
  }
  function abText() { return "A " + (pointA === null ? "—" : mmss(pointA)) + "  B " + (pointB === null ? "—" : mmss(pointB)); }
  document.querySelectorAll('input[name="rep"]').forEach(function (r) { r.addEventListener("change", function () { setRep(this.value); }); });
  document.getElementById("seta").addEventListener("click", function () { if (cur < 0) return; pointA = paused ? pausedPos : B.pos(); if (pointB !== null && pointB <= pointA) pointB = null; document.getElementById("abtxt").textContent = abText(); });
  document.getElementById("setb").addEventListener("click", function () { if (cur < 0) return; var p = paused ? pausedPos : B.pos(); if (pointA === null) pointA = 0; if (p > pointA + 0.5) pointB = p; document.getElementById("abtxt").textContent = abText(); });
  document.getElementById("clrab").addEventListener("click", function () { pointA = null; pointB = null; document.getElementById("abtxt").textContent = abText(); });
  setRep(repMode);
  function tick() {
    if (!dragging && !paused) {
      var pos = B.pos(); seek.value = pos; show(pos);
      var sec = B.bgm[cur].sec;
      if (repMode === "ab" && pointA !== null && pointB !== null && pos >= pointB) { B.seek(pointA); }
      else if (pos < lastPos - 1 && lastPos > sec * 0.5) {
        // 曲の最後まで来て、頭に戻った瞬間
        if (repMode === "off") { document.getElementById("stop").click(); return; }
        if (repMode === "all") { lastPos = 0; select((cur + 1) % B.bgm.length, 0); return; }
      }
      lastPos = pos;
    }
    raf = requestAnimationFrame(tick);
  }
  function jump(pos) {
    var sec = B.bgm[cur].sec; pos = ((pos % sec) + sec) % sec;
    if (paused) { pausedPos = pos; seek.value = pos; show(pos); } else { B.play(cur, pos); }
  }
  seek.addEventListener("input", function () { dragging = true; show(Number(seek.value)); });
  seek.addEventListener("change", function () { dragging = false; jump(Number(seek.value)); });
  document.getElementById("back").addEventListener("click", function () { jump((paused ? pausedPos : B.pos()) - 10); });
  document.getElementById("fwd").addEventListener("click", function () { jump((paused ? pausedPos : B.pos()) + 10); });
  document.getElementById("pause").addEventListener("click", function () {
    if (cur < 0) return;
    if (!paused) { pausedPos = B.pos(); B.stop(); paused = true; this.textContent = "再開"; }
    else { B.play(cur, pausedPos); paused = false; this.textContent = "一時停止"; }
  });
  document.getElementById("stop").addEventListener("click", function () {
    B.stop(); cancelAnimationFrame(raf); paused = false; document.getElementById("pause").textContent = "一時停止";
    if (cur >= 0) setRowState(cur, false);
    cur = -1; enable(false); seek.value = 0; timeEl.textContent = "0:00 / 0:00";
    document.getElementById("name").textContent = "停止中"; document.getElementById("sub").textContent = "";
  });
  document.querySelectorAll('input[name="ed"]').forEach(function (r) {
    r.addEventListener("change", function () {
      var pos = cur >= 0 && !paused ? B.pos() : 0;
      B.setEdition(this.value);
      if (cur >= 0 && !paused) B.play(cur, pos);
    });
  });
  document.getElementById("synth").addEventListener("change", function () { B.synthOnly(this.checked); });
  setInterval(function () { document.getElementById("sf").textContent = B.sampled() ? "録音音源: 使用中" : "録音音源: 準備中…"; }, 500);
  document.getElementById("vol").addEventListener("input", function (ev) { B.volume(ev.target.value / 100); });
  B.volume(0.6);
})();
</script>
