<script>
/* 音源ファイル（sf/）を読む。もとは1ファイルの中に埋め込んでいた音源を、Artifact に載せるために別ファイルにした。
   - fetch: 分割したもの（#parts=K）は、つないで1つにして渡す
   - atob: 作曲ソフトは埋め込みの音源を atob で取り出すので、「sf/…」が来たら、そのファイルをその場で読んで同じ形（1文字＝1バイト）で返す */
(function () {
  var f0 = window.fetch.bind(window), a0 = window.atob.bind(window), cache = {};
  function partsOf(url) { var m = /^(.*?)#parts=(\d+)$/.exec(url); return m ? { base: m[1], k: +m[2] } : null; }
  window.fetch = function (input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    var p = partsOf(url);
    if (!p) return f0(input, init);
    var ps = [];
    for (var i = 0; i < p.k; i++) ps.push(f0(p.base.replace(/\.wasm$/, ".p" + i + ".wasm")).then(function (r) { if (!r.ok) throw new Error("音源を読めませんでした: " + r.url); return r.arrayBuffer(); }));
    return Promise.all(ps).then(function (bufs) { return new Response(new Blob(bufs)); });
  };
  function getSync(url) {
    var x = new XMLHttpRequest();
    x.open("GET", url, false);
    x.overrideMimeType("text/plain; charset=x-user-defined");
    x.send(null);
    if (x.status !== 200 && x.status !== 0) throw new Error("音源を読めませんでした: " + url);
    var t = x.responseText, out = new Array(Math.ceil(t.length / 65536));
    for (var i = 0, j = 0; i < t.length; i += 65536, j++) {   // 上の8ビットを落として 1文字＝1バイトに
      var c = t.substr(i, 65536), b = new Array(c.length);
      for (var n = 0; n < c.length; n++) b[n] = c.charCodeAt(n) & 255;
      out[j] = String.fromCharCode.apply(null, b);
    }
    return out.join("");
  }
  window.atob = function (s) {
    if (typeof s === "string" && s.slice(0, 3) === "sf/") {
      if (cache[s] == null) {
        var p = partsOf(s);
        if (p) { var all = []; for (var i = 0; i < p.k; i++) all.push(getSync(p.base.replace(/\.wasm$/, ".p" + i + ".wasm"))); cache[s] = all.join(""); }
        else cache[s] = getSync(s);
      }
      return cache[s];
    }
    return a0(s);
  };
})();
</script>
