<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- サンシャイン作曲ソフトのアイコン（オリジナル）: 夜明けの太陽と、音の波 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff2fd0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#2a7bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="upper"><rect x="0" y="0" width="1024" height="600"/></clipPath>
    <clipPath id="sunClip"><circle cx="512" cy="600" r="251"/></clipPath>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="200" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="200" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="8"/>
  <!-- 太陽（地平線から昇る） -->
  <g clip-path="url(#upper)" filter="url(#glow)">
    <circle cx="512" cy="600" r="250" fill="url(#sun)"/>
  </g>
  <!-- 太陽の横じま（レトロな夕日） -->
  <g fill="#0b1424" clip-path="url(#sunClip)">
    <rect x="240" y="470" width="544" height="14"/>
    <rect x="240" y="515" width="544" height="20"/>
    <rect x="240" y="562" width="544" height="26"/>
  </g>
  <!-- 光の線 -->
  <g stroke="#ffd166" stroke-width="22" stroke-linecap="round" opacity="0.9">
    <line x1="512" y1="210" x2="512" y2="290"/>
    <line x1="300" y1="290" x2="345" y2="345"/>
    <line x1="724" y1="290" x2="679" y2="345"/>
    <line x1="190" y1="455" x2="265" y2="470"/>
    <line x1="834" y1="455" x2="759" y2="470"/>
  </g>
  <!-- 地平線と、音の波 -->
  <line x1="150" y1="600" x2="874" y2="600" stroke="#00e5ff" stroke-width="10" stroke-opacity="0.7"/>
  <path d="M170 720 C 230 640, 290 640, 350 720 S 470 800, 530 720 S 650 640, 710 720 S 830 800, 860 740"
        fill="none" stroke="url(#wave)" stroke-width="34" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M220 820 C 290 780, 360 780, 430 820 S 570 860, 640 820 S 760 780, 810 810"
        fill="none" stroke="#ff2fd0" stroke-width="18" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
